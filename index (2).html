  T("jb1", "⚔ CP", 50, "P1", "JetBrains Youth Coding Club, contest 1 (Prefix Sums and Difference Arrays), in their Codeforces group (codeforces.com/group/vhYDNJe7qM/contest/728587): problems A to E before Thu Nov 12 (the club's own words: 'two weeks to solve each contest'; the 40%-less-after-deadline rule confirmed in #announcements, Oct 31). First pashka's lecture (youtube.com/watch?v=-8ZvGT0lcWo, from #resources-and-links), then each problem on paper first, then Python (PyPy 3). Stuck for 20 minutes: the hints in #classes-discussion and #questions, never a full solution, never AI (the club checks submissions). This week's reading on the spine: USACO Guide Silver, Introduction to Prefix Sums (usaco.guide/silver/prefix-sums) and More on Prefix Sums (usaco.guide/silver/more-prefix-sums, which has its own Difference Arrays section). Extra practice once A–E are done: CSES Maximum Subarray Sum, Range XOR Queries, Range Update Queries, Forest Queries. F to T are not for now: they become the deep drill when the USACO spine reaches prefix sums in Silver (spring 2027). Note: the club gave no exact clock time for the deadline, only 'next Thursday, Nov 12' — the plan treats it as end of day IST; also new from the club's Oct 29 welcome message: advancing to semester 2 needs 50% of each contest solved (10 of 20) plus one TA solution interview, not just A–E, though the club says school students get interview priority.", null, ["2026-11-09", "2026-11-12"], { short: "JetBrains contest 1: A–E by Thu Nov 12", carry: false, probs: [{ tr: "jb", c: 1, n: 5 }], steps: ["Watch the contest 1 lecture once (prefix sums, then difference arrays).", "A (Prefix Sums) and B (Range Sum): the prefix array, then a range as p[r] - p[l-1].", "C (Range XOR): the same idea with XOR.", "D (Range Additions) and E (Additions, Then Sums): the difference array, then its prefix sums.", "Each accepted problem: one line in your CP notes on what the trick was."] }),
  T("camp", "🏛 Campus", 25, "P0", "Campus: assignments, notes, and today's gap."),
  T("syn", "⚔ DSA", 15, "P0", "Syntax drill, shorter now: 2–3 exercises, or retype a solved problem from memory.", null, null, { probs: [{ tr: "syn" }] }),
  T("lc", "⚔ DSA", 60, "P0", "Striver A2Z, one topic at a time, in sheet order: watch the topic's TUF video once, then 1–2 problems a day. Paper first; 50-minute stop rule. Once it passes, read the editorial and trace one unfamiliar line. Log the topic plus one line on how you'd recognize it next time.", null, null, { probs: [{ tr: "nc", n: 1 }] }),
  T("rs", "⚔ DSA", 25, "P1", "Re-solve from a blank page 2 problems you solved 3+ days ago. Can't finish one? It goes back on your list.", [0, 3], null, { probs: [{ tr: "re", n: 2 }] }),
  T("cf", "⚔ CP", 45, "P1", "CP Saturday, in Python until the Dec 20 check: the next step of the USACO spine (the CP ladder on the Roadmap). One lesson of CPI's free Bronze video course (joincpi.org/bronze-video-classes), then that lesson's USACO Guide module and its Easy problems: paper first, 50-minute stop rule, the editorial only after it. Optional, on a weekend evening: a rated Div 4 or Div 3, solo, stopping by 10:10 pm for the Prabhu-milan slot; upsolve one problem in the next session.", [6], null, { short: "CP: the next USACO step", probs: [{ tr: "us", n: 2 }], skipOn: ["2026-12-12", "2026-12-19", "2026-12-26"], steps: ["Nov 7: the Guide's General essentials: Using This Guide, Expected Knowledge, Input & Output (Python), How to Practice.", "Nov 14: CPI Bronze week 1 (Time Complexity and Rectangle Geometry): the videos, then 2–3 of its problems.", "Nov 21: week 1's remaining problems, with the Guide's Time Complexity and Rectangle Geometry modules.", "Nov 28 (the drill Saturday: 30 minutes is enough): CPI week 2, Data Structures and Simulation.", "Dec 5: Simulation problems. Weeks 3–8 continue on Tue/Thu (Nov 27 – Dec 4) and in the winter break."] }),
    T("cf2", "⚔ CP", 30, "P1", "CP, Tue and Thu until the exam trim, in Python: the next USACO Bronze step from where Saturday stopped (CPI week 2 or 3: Simulation, Basic Complete Search), one lesson or 2–3 of its Guide problems.", [2, 4], null, { from: "2026-11-27", until: "2026-12-06", short: "CP: the next USACO step", probs: [{ tr: "us", n: 1 }] }),

  T("mom", "🪙 Artha", 45, "P1", "Artha, five conversations at home with small-business owners (people your father works with, shopkeepers, a contractor): how did they plan last week, what slipped, what did it cost them, what have they already tried? Ask about their past and never pitch your idea (the rule of The Mom Test). Ten lines of notes for each in your IET workbook. Tick when all five are done and bring the notes to a chat. This is how you learn whom you'd sell to and how to reach them, instead of guessing.", null, ["2026-12-29", "2027-01-09"], { short: "Artha: five conversations", until: "2027-01-10" })]
},

  tasks: [
  T("gsocorg", "🪙 Artha", 45, "P1", "Income plan, track B: Google Summer of Code 2027. Pick two open-source organisations from the 2026 list that use Python and ML (the 2027 list comes about mid-February), set each one up locally and land your first small contribution (a good-first-issue). Why: GSoC pays Indian contributors $750, $1,500 or $3,000 for a small, medium or large project (about Rs 70k to Rs 2.8L, paid in two parts), and selection rewards people who already contributed. It is not regular income, but it is paid proof of skill for the track A applications. Two sessions a week; tick when one contribution is merged.", [3, 6], null, { short: "GSoC: pick orgs, first contribution", from: "2027-01-18", until: "2027-03-14" }),

  T("inc1", "🪙 Artha", 20, "P0", "Income checkpoint 1 of 4: is a PAID summer lined up (an internship offer from track A, a GSoC selection, or a first paying customer for track C)? Yes: write it in Notes for Claude with the amount. No: the pivot, the same week: ten more targeted applications (startups at Deshpande Startups in Hubballi, IISc's incubators, the seniors' leads), walk in to one Hubballi startup with your project on the phone, and ask Claude in a chat to re-plan the summer. The gate in mid-2028 depends on starting paid work by summer 2027.", null, ["2027-04-24", "2027-04-30"], { short: "Income checkpoint 1: paid summer?" }),
  T("camp", "🏛 Campus", 60, "P0", "Campus courses: close today's gap before sleeping. CGPA bar: 9."),
  T("lc", "⚔ DSA", 60, "P0", "A2Z ladder, one topic at a time, 1–2 problems a day, Python.", null, null, { probs: [{ tr: "nc", n: 1 }] }),
  T("proj", "💻 Project", 45, "P1", "Study-notes assistant. Jan: load PDFs, chunk, embed, retrieve, answer with page citations. Feb: Streamlit UI, deploy, 5 classmates using it; talk to them. Mar: test on 20 real questions, fix failures, README and 2-minute demo, submit. Track weekly users: that number is also your founder signal."),
  T("cf", "⚔ CP", 30, "P1", "CP in C++. Tue and Thu, the USACO spine: Bronze's last modules and its Additional Practice by mid-February, then CPI Silver weeks 1–4 (prefix sums, custom comparators, two pointers, sorted sets) with their Guide modules, and the CSES Sorting and Searching problems those modules link, as they come. For prefix sums, JetBrains contest 1's F onward is the deep drill. Saturday: a rated Div 3/4 or Educational round (stop by 10:10 pm), then upsolve one; no round this weekend, then the Codeforces ladder's problem.", [2, 4, 6], null, { must: true, short: "CP: the next USACO step", probs: [{ tr: "us", n: 1, days: [2, 4] }, { tr: "cses", n: 1, days: [2, 4] }, { tr: "cf", n: 1, days: [6] }] }),
  T("brain", "📈 BRAIN", 45, "P2", "WorldQuant BRAIN, Saturdays only: one idea, simulated and written up (what it predicts, why it might work, what the results say). IQC qualifier from mid-March, if you enter.", [6]),
  T("r0chk", "🧭 Career", 10, "P2", "Return_0 check (your rule, Oct 25: tech clubs only while they are productive). Over Sem 1, did its sessions teach you something you used in a contest or in interview prep? Yes: stay, and apply to its tech team. No: leave it; Codeforces and ICPC don't need a club.", null, ["2027-01-18", "2027-01-24"], { short: "Return_0: stay or leave" }),
  T("iapp", "🪙 Artha", 30, "P1", "Artha: apply for a paid summer-2027 internship at incubated startups. Twenty targeted applications, not a hundred: Deshpande Startups in Hubballi (517+ startups incubated, about 20 km away), IISc's incubators (Ankit's was CPDMed TBI), and every lead from Ankit and the seniors. Each one: the study-notes assistant's link and two lines on what you would build for that startup. Tick when twenty are sent.", null, ["2027-02-01", "2027-03-15"], { short: "Artha: 20 internship applications", until: "2027-03-31" }),

  T("leeegate", "🎯 LEEE", 20, "P1", "LEEE: apply (the application costs ₹3,100 and opens about mid-February). Applying is cheap; the decision to join comes at the seat offer, against the income gate.", null, ["2028-01-05", "2028-01-20"], { short: "LEEE: apply" }),

    now: ["The Mool Ramayan shloka each day (6:15 pm) is already your daily Sanskrit and Hindi.",
    "From Tue Nov 10: Hindi vyakaran on Tue, Thu and Sat, 20 minutes with the exercises, in this order. (1) वर्ण-विचार and उच्चारण-स्थान, where in the mouth each letter is made: कण्ठ्य, the throat (क); तालव्य, the hard palate (च); मूर्धन्य, the roof of the mouth with the tongue tip curled back (ट); दन्त्य, the teeth (त); ओष्ठ्य, the lips (प). (2) ह्रस्व-दीर्घ, short and long vowels, and the मात्रा, the vowel signs. (3) अनुस्वार (the dot, ं), अनुनासिक (the chandrabindu, ँ: the vowel sounded through the nose too), विसर्ग (ः, a soft breathed h) and हलन्त (्, a consonant with no vowel). (4) संयुक्ताक्षर, joined letters (क्ष, त्र, द्ध). (5) लघु-गुरु, light and heavy syllables (one clap and two), and counting the अक्षर, the syllables. (6) छन्द-परिचय, metre: पाद, a quarter of a verse; अनुष्टुप्, the Ramayana's shloka, eight syllables a pada; दोहा and चौपाई, Tulsidas's metres. (7) सन्धि, sounds joining where words meet. (8) समास, compound words. (9) कारक-विभक्ति, a noun's role in the sentence and its ending (ने, को, से, का). Only then वाच्य (active and passive voice), then अलंकार (figures of speech).",
    "Why this order: it comes from what the daily Mool Ramayan sessions demand of you, reading a Sanskrit shloka correctly, not from any book's chapter order. So take the chapters of Prasad's 'Adhunik Hindi Vyakaran aur Rachna' in this order, not the book's. Hindi's grammar is half Sanskrit's, so it is the bridge.",
    "English joins on Mon Dec 28, in the winter break: Mon, Wed and Fri, one poem or ten pages read aloud, then five lines of your own.",
    "Where you start (Prince, Oct 9): Hindi and English you already use; Sanskrit from the daily Mool Ramayan sessions; Tamil from zero, so every Tamil line you're given comes in Devanagari with its meaning, never in Tamil script alone."],
    order: "Two at a time, never four, and never two starting in the same week: Hindi from Nov 10, English from Dec 28, once Hindi has held for six weeks. Sanskrit begins in summer 2027. Tamil begins in summer 2028 with the script, to read the Prabandham in its own letters. Honest about Tamil: reading the Prabandham with its meaning by 2032 is realistic; spoken fluency without living among Tamil speakers isn't, so the aim is depth of reading. One exercise ties them together from Year 2: render a Mool Ramayan shloka or a pasuram's meaning in your own Hindi and English verse.",
    arc: [["Year 1 · 2026–27", "Hindi vyakaran end to end from one standard grammar (Vasudev Nandan Prasad's 'Adhunik Hindi Vyakaran aur Rachna'; Kamta Prasad Guru's 'Hindi Vyakaran' as the reference), its chapters taken in the order above, and tatsam-rich Hindi to read: Dinkar's 'Rashmirathi'. English: Tagore's own English 'Gitanjali' (devotional, a few songs a week), then a sonnet a week read closely and one memorised a month; writing craft from Strunk's 'The Elements of Style'. No literature or oratory club (your rule, Oct 25: no cultural clubs); speaking practice comes from reading aloud now and interview practice later. Summer 2027 at home: Samskrita Bharati's ten-day spoken-Sanskrit camp, then their correspondence course, Pravesha level (6 months, ₹300)."],
    ["Year 2 · 2027–28", "Sanskrit: Parichaya and Shiksha levels; the Mool Ramayan shlokas read without the translation wherever you can. English: a 300-word essay every week, and the poets of the canon read aloud (Shakespeare, Milton, Wordsworth, Keats, Tennyson); interview English: explain your projects aloud. Hindi: your sadhana notes in shuddh Hindi. Summer 2028: Tamil script."],
    ["Year 3 · 2028–29", "Sanskrit: Kovida level, then Paninian grammar with a teacher (Laghu Siddhanta Kaumudi) and Amarakosha's first kanda by heart. Tamil: reading the Prabandham you recite in its own script, word by word with the meaning. English: your own poems and translations, read by someone who knows the craft."],
    ["Year 4 · 2029–30", "The Gita with Ramanuja's bhashya and the Valmiki Ramayana read in Sanskrit, the translation only to check yourself; English at interview level under placement pressure; Tamil reading kept up weekly."],
    ["Years 5–6 · 2030–32", "Sanskrit good enough to follow a kalakshepam without translation; Tamil good enough to read the pasurams you know with their vyakhyanam in Hindi or English beside them; English and Hindi as your two writing languages: verse renderings of stotras and pasurams, as seva."]] },
  sharira: { q: ["अपि स्वशक्त्या तपसि प्रवर्तसे? शरीरमाद्यं खलु धर्मसाधनम् ॥", "Is your tapas within your strength? The body is the first means of dharma. (Kalidasa, Kumarasambhavam 5.33)"],
    now: ["The gym (from Nov 12): Athlean-X Perfect Workout 3-day split at 4 pm \u2014 Mon chest + triceps (after the PSP lab), Thu back + biceps, Sat legs + shoulders, about 60 minutes in the college gym (cables, barbells, racks). A fourth day from Jan 18 only if the three held through November and December. Exam weeks: two lighter sessions (Mon and Thu), never a zero week.",
    "The right hip first. For four weeks: no heavy squats, deadlifts or leg press; hip mobility, glute bridges and light single-leg work instead, adding load only while it stays pain-free. Pain in a session or the next morning, or a feeling of instability: stop loading it and see the campus doctor or a physiotherapist.",
    "Week one: a baseline (strict pull-ups, push-ups, plank time; no separate walk: the campus walking covers it, and running waits until the hip has had four pain-free weeks), so your targets come from your own numbers. At home: 20 minutes of bodyweight work and a walk."],
    arc: [["Year 1 · 2026–27", "The gym habit back and held through exams; the hip rebuilt before heavy lower-body work; one campus sport played weekly from Jan 2027; swimming learned at home in summer 2027; 7+ hours of sleep."],
    ["Year 2 · 2027–28", "Four sessions a week; one sport chosen to get genuinely good at, with coaching or a team; inter-hostel events."],
    ["Year 3 · 2028–29", "Strength kept through internship season; the college team if you're good enough; a first-aid and CPR course."],
    ["Year 4 · 2029–30", "A 30-minute minimum version for interview weeks, never a zero week."],
    ["Years 5–6 · 2030–32", "A working life's routine: training or sport four mornings a week, and a yearly health check."]] },
  kala: { q: ["गीतं वाद्यं तथा नृत्तं त्रयं सङ्गीतमुच्यते ।", "Song, instrument and dance, the three together, are called sangita. (Sarngadeva, Sangita Ratnakara)"],
    now: ["Singing from zero (Prince, Oct 9: no training yet, only listening and singing along). So the first month is the very beginning: finding your Sa on a tanpura app, matching one note at a time, learning the seven swaras by ear. 5 minutes as a refreshment break between two study blocks (your rule, Oct 31), exam days too. No YouTube in the riyaz: that's where the songs and shorts begin.",
    React.createElement(React.Fragment, null, "By stage, not by certificate (Prince, Oct 10: certification isn't your necessity). The path is six stages, each opened only when the one before meets its gate, and nothing is set that rests on a step you haven't confirmed: until your Sa is set on the tanpura app, the riyaz is that setup (week one stalled on exactly this). The words and stages, explained from zero: ", React.createElement("a", { href: "https://claude.ai/artifact/EmRVKoAEhwZ8yYJXD1QAWR", target: "_blank", rel: "noopener noreferrer", style: { fontWeight: 700 } }, "Riyaz from zero"), "."),
    "Drawing from Sun Jan 17, after the winter break: one 40-minute session a week, quiet and cheap (a pencil, an eraser, a sketchbook). Fundamentals first: lines, shapes, boxes in perspective, light and shade, from the free Drawabox lessons or Betty Edwards's 'Drawing on the Right Side of the Brain'.",
    "A teacher for singing: you study in the southern home of Hindustani music: Mallikarjun Mansur and Basavaraj Rajguru of Dharwad, Gangubai Hangal of Hubli, Sawai Gandharva of Kundgol, Bhimsen Joshi of Gadag. Not the campus music club (your rule, Oct 25: no cultural clubs, they turned out to be timepass): a teacher off campus, once money allows. Schools affiliated to the Gandharva Mahavidyalaya are only a way to find a teacher; their exams are not your goal. A paid teacher for a weekly class only once earned income shows in the Money card (the Artha plan), so 2027 at the earliest.",
    "Shastra and your tradition: Manusmriti 2.178 lists dancing, singing and playing instruments among what a brahmachari avoids; your sampradaya sings the Prabandham to the tunes Nathamuni set, and the Araiyar sevai enacts it in the temple. Devotional singing has your tradition behind it; dance is the open question, so it is on guruji's list."],
    order: "One new skill at a time. Voice now; drawing from Jan 17, after English has started (it needs no money and makes no noise in a hostel). Tabla from summer 2027, with a teacher at home in Mumbai: laya makes the singer. Painting in Year 2: Mithila (Madhubani) painting, the folk art of Sita's own Mithila, whose classic subjects are Sita and Rama, the same Ramayana you recite. Bansuri only once voice and tabla are steady (Year 3). Keyboard and guitar aren't planned: they don't serve this path, and money is tight; a harmonium only if your teacher asks for one. Dance waits for guruji's word and starts no earlier than summer 2028, at home: Kathak dances to Hindustani music and tabla, the system you'll already be in; Kuchipudi and Bharatanatyam have strong male, Vaishnava story traditions but run on Carnatic music.",
    arc: [["Year 1 · 2026–27", "Singing from zero, stages 1–4: Sa alone, then the seven swaras, then alankars, then the first low notes (kharaj) and breath, each stage opened only by its gate; a teacher from Jan 2027 if money allows. Drawing from January: a weekly fundamentals session, one sketchbook filled."],
    ["Year 2 · 2027–28", "Stages 5–6: a first raga (Yaman, or the one your teacher chooses), then first bandishes; bhajans sung at a temple or satsang; tabla begun. Mithila painting: its line work (kachni) and filled colour (bharni), first scenes from the Ramayana."],
    ["Year 3 · 2028–29", "A second and third raga, bada khayal begun; bhajans with tabla you play yourself; bansuri if voice and tabla are steady; dance only with guruji's yes. A Mithila painting finished each vacation."],
    ["Year 4 · 2029–30", "Riyaz kept alive through placements, 15 minutes minimum; a sketch a week."],
    ["Years 5–6 · 2030–32", "A settled personal repertoire; singing and painting as seva: bhajans, the Prabandham the way your tradition sings it, paintings for the home mandir and festivals."]] },
  artha: { q: ["अद्रोहेणैव भूतानामल्पद्रोहेण वा पुनः । या वृत्तिस्तां समास्थाय विप्रो जीवेदनापदि ॥", "Outside a time of distress, a vipra should live by a livelihood that harms no being, or harms it the least. (Manusmriti 4.2)"],
    now: ["Why this section (Oct 17): the money videos asked whether the job route is too slow. Checked against sources (AR-01 in NotebookLM), the foundation holds and Vidya stays the floor that is never skipped. What was missing is a line from now to money. This section is that line.",
    "Your aim, in your words: earn as fast as possible, ethically and within your interests. The freedom you want is freedom from earning-work, not from kainkarya: time for Sri Vaishnavas, for family and for other kainkaryas. Income that runs without your hours comes from owning something (a product, a system others run, savings that work), and that takes years of skill first. So every rung here builds a skill that also earns.",
    "Self-funding, in numbers (Oct 19): savings were about ₹21,800 on Sep 30. Without Claude Pro you spend about ₹700 a month, so savings cover about two years; with Pro (₹2,000 more) about six or seven months. So money doesn't force anything this year: Pro renews only on the floor rule (10 of the last 14 days), and the page runs your days without it.", "Where the first rupees come from, realistically: hackathon prizes (from the seniors' list, never in exam weeks; Ankit's wins came from campus ones), small paid builds for people you meet in the winter conversations (from Jan 2027, once the study-notes assistant proves you can ship), and the paid summer-2027 internship. The first rupee is likely January to July 2027, not this month; nothing faster is ethical, in your interest and real.", "Priority (Prince, Oct 19): daily dharmic kritya first, then artha and vidya, then sharira, kala, bhasha. Between artha and vidya: until paid work exists (about summer 2027), almost every rupee comes through vidya (the skill is the product), so vidya leads. Once paid work exists, a paid deadline may beat an ordinary study block, but never an exam block or the 9 CGPA bar.",
    "Five rules. (1) Real work for real people only: never sell a course on what you haven't done, never promise anyone income, no paid 'how to earn' courses. (2) No new spending on an earning venture (platforms, ads, courses) before its first rupee; Claude Pro is a study tool, kept only under the floor rule. (3) Artha pauses first: if the study floor falls below 10 of 14 days, or a grade threatens the 9, Artha's hours stop before anything in Vidya does. (4) Never in exam weeks or the 7 days before an exam. (5) Every rupee earned goes in the Money card on My log; decide the share for seva before the first one arrives.",
    "The income plan (Oct 25): at least ₹20,000 a month, every month from January to June 2028, from work that continues; ₹50,000 a month by mid-2030. Who pays you, and for what. (A) Startups pay for working features: an LLM or RAG feature, an AI agent that automates a task, a data pipeline, a backend API, a dashboard. Where: incubated startups at Deshpande Startups in Hubballi and IISc's incubators (Ankit Dash's road from this campus), and postings on Internshala, Wellfound and LinkedIn. How you get in: one deployed project with real users (the study-notes assistant, Jan to Mar 2027), a clean GitHub, and twenty targeted applications that each say what you would build for that startup; then, before the summer ends, ask to continue part-time and paid (checkpoint 2). (B) Open-source programs pay for code merged into real projects: Google pays GSoC contributors in India $750, $1,500 or $3,000 a project, and the Linux Foundation pays LFX mentees in India $1,300 a term. (C) Small businesses pay for automation that saves them time (reminders, follow-ups, bookings, stock in a sheet with an AI agent on top): a setup fee plus a monthly fee; your IET capstone idea. The numbers, honestly: the average Indian internship stipend was about ₹8,000 a month in 2024 (Internshala), so ₹20,000 regular in Year 2 is upper-tail: reachable with a real skill, a track record and two sources, not guaranteed. Four checkpoints (Apr, Jul, Oct 2027, Jan 2028) each carry a pivot, so a miss shows early.",
    "Who does what (Prince, Oct 17): you learn and execute; Claude vets sources and writes the video postmortems. Send any earning video's link below and read only what survives. What you still do yourself, because the doing is the learning: conversations with people who might pay or who have walked the road, and real work for real users."],
    order: "Skill first, then paid work for startups (the road Ankit Dash took from this campus), then something of your own. Conversations before building, free before paid, results before teaching. Each rung's tasks reach Today on their dates; nothing here runs in exam periods." },
  mlech: { now: ["Knowledge of today's societies and the forces behind them: your research and knowledge-intake field, to understand this part of the world before the six-year target. The source is Swami Nigrahacharya ji's Dark Secrets 'Mlechchha Raaj' (Season 1: Episode ∞ and 1–53; Season 2: 1–10; 64 talks in Hindi, about 48 hours). Swami ji, with your guruji and dadaguruji, is one of the three acharyas you follow.",
    "The slot, from Sun Nov 15, 2026 (you asked on Oct 25 to start the work now; the first session moved off Deepavali, Nov 8, to the next Sunday, the date you left to Claude on Oct 31): one session every Sunday, about an hour, on the day without the gym; a second on Thursdays in long vacations. None in exam weeks or the week before one, and never in place of a study block, the riyaz or the shloka. Swami ji's own books join it: he publishes them free on the Internet Archive as Shri Bhagavatananda Guru (about 29 items, CC BY-NC-ND), and Claude puts them into one NotebookLM notebook, DS-00, so a session can check an episode against what Swami ji wrote. The anadhyayana kalam pauses Prabandham recitation, not lectures like these, so it runs through Nov 25 – Jan 26 (ask guruji if he sees it otherwise).",
    "A session is one episode: watch it at 1.25x (slower for Sanskrit), read that video's part of the study notes in its NotebookLM notebook (DS-01 … DS-18), write 5–10 lines and your questions in your own words, and mark any claim worth checking. Tick it in Today's anchors and the next one moves up by itself. After a bucket's last episode comes a close session: ten lines on what the bucket argued, its three most important claims into the register below, and one of them checked.",
    "Three rules. These are the speaker's claims, many about living people and organisations: check before you repeat them to anyone. Study, never practice: no mantra, yantra or rite described in DS-05 or DS-06 is ever recited or tried (they are described to expose them; a doubt goes to guruji). Auto-captions and NotebookLM mangle Sanskrit, so for a quoted shloka the audio is the authority."],
    order: "Buckets DS-01 to DS-15 follow Season 1's argument in order; Season 2 (DS-16 to DS-18, current affairs) comes after it, not alongside: one stream at a time. Inside a bucket, episodes in number order. When the series is done the Sunday slot stays: it becomes verification (the oldest open claim, checked against the book, letter, court record or census table it rests on) plus any new episode Swami ji releases.",
    arc: [["Year 1 · 2026–27", "Season 1 from Nov 15, one episode a Sunday and two a week in long vacations: DS-01 to DS-10 by the end of summer 2027, with a claims register built bucket by bucket."],
    ["Year 2 · 2027–28", "Season 1 finished (about January 2028), then Season 2 (about May 2028; the Progress card keeps the live date). From then on the slot checks claims: one a session, against the primary source it rests on."],
    ["Year 3 · 2028–29", "Primary sources read where the series leans hardest on them: Satyarth Prakash (DS-11), Max Müller's letters and the Boden chair record (DS-12, DS-15), Vivekananda's Complete Works (DS-14, DS-15), the founder's own books and recorded talks (DS-08 to DS-10), the census and demography tables (DS-17)."],
    ["Year 4 · 2029–30", "Placement year: new episodes only, and the register kept current."],
    ["Years 5–6 · 2030–32", "A sourced summary in your own words, bucket by bucket: what held up, what didn't, what stays open; taken to your acharyas for their correction. New material as it comes."]] } };

["🧮 CSES Problem Set", "The standard-problem checklist (400 problems). Not a separate slot: the Guide's modules link many CSES problems, and vacations sweep a section. The target is the six core sections, 159 problems: Introductory 24, Sorting and Searching 35, DP 23, Graph 36, Range Queries 25, Tree 16. In C++ (its 1-second limits give Python no extra time). Its companion from the winter break: the Informatics Observatory (https://rik-informatics-observatory.spiffywolf512.chatgpt.site/#learn, a page a friend shared), which maps every CSES problem to a skill, the exact pages of the free Competitive Programmer's Handbook (CPH) to read first, three progressive hints, and a 3/7/14-day re-solve queue. Use it for exactly that: hint 1, then 2, then 3, its full explanation only after the 50-minute stop rule. Ignore its ZCO-to-IOI route and planner: that olympiad is for school students up to Class 12, so you are not eligible. Its progress lives only in that browser and it is someone else's page that can vanish, so export a backup (Settings & backup) each month and keep CSES itself as the record."],
